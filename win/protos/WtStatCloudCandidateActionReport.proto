syntax = "proto3";
package com.tencent.wrbus.pb;
import "BaseMsg.proto";
import "WtKeyboardType.proto";

message WtStatCloudCandidateActionReport {
  com.tencent.wrbus.pb.BaseMsg base_log = 1;
  string engine_version = 2;
  string dict_infos = 3;
  com.tencent.wrbus.pb.WtKeyboardType keyboard_type = 4;
  string action = 5;
  string candidate_type = 6;
  int64 candidate_length = 7;
  int64 candidate_index = 8;
  int64 duration = 9;
  int64 syllable_length = 10;
  string request_id = 11;
  int64 gap_duration = 12;
  int64 cloud_service_version = 13;
  int64 cloud_source = 14;
}
