syntax = "proto3";
package com.tencent.wrbus.pb;
import "BaseMsg.proto";
import "WtKeyboardType.proto";
import "WtAiQuestionAction.proto";
import "WtStatCandidateScene.proto";

message WtStatAiQuestionActionReport {
  com.tencent.wrbus.pb.BaseMsg base_log = 1;
  com.tencent.wrbus.pb.WtKeyboardType keyboard_type = 2;
  com.tencent.wrbus.pb.WtAiQuestionAction action = 3;
  string request_id = 4;
  string send_id = 5;
  string bundle_id = 6;
  com.tencent.wrbus.pb.WtStatCandidateScene app_scene = 7;
  int64 is_chat = 8;
  int64 panel_status = 9;
  int64 question_type = 10;
  int64 content_type = 11;
  int64 page_stay_duration = 12;
  int64 panel_stay_duration = 13;
  int64 page_content_load = 14;
  string question_content = 15;
  string answer_content = 16;
  string item_name = 17;
  int64 item_index = 18;
  int64 length = 19;
  int64 screen_status = 20;
  string answer_type = 21;
  string a_b_params = 22;
  string action_source = 23;
  string sent_type = 24;
  string bubble_type = 25;
  int64 answer_load_duration = 26;
}
