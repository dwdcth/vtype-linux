// 提取自微信输入法 Windows 版，勿手改；用 extract_all.py 重新生成
syntax = "proto3";
package com.tencent.wrbus.pb;

enum ABTestKeyboardType {
  kUnKnowKeyboardType = 0;
  kFullPinyin = 1;
  kT9Pinyin = 2;
  kFullEnglish = 3;
  KHandWriting = 4;
  KT9Stroke = 5;
  KFullWubi = 6;
}

enum ABTestOsType {
  kUnKnow = 0;
  kAndroid = 1;
  kIos = 2;
  kApplet = 3;
  kH5 = 4;
  kMac = 5;
  kWindows = 6;
}

enum ABTestDevicePerformance {
  HIGH = 0;
  STANDARD = 1;
  LOW = 2;
  INVALID = 100;
  ULTRA_HIGH = -5;
}

message ABTestStatus {
  int32 code = 1;
  string message = 2;
}

message ABTestHitedInfo {
  enum HitType {
    Unknown = 0;
    WhiteList = 1;
    LaunchLayer = 2;
    BaseAB = 3;
    DefaultParam = 4;
  }

  com.tencent.wrbus.pb.ABTestHitedInfo.HitType hit_type = 3;
  uint32 expt_id = 1;
  uint32 group_id = 2;
  uint32 launch_layer_id = 4;
  uint64 bucket_src = 5;
}

message ABTestHitDetailInfo {
  message Item {
    message ParamsEntry {
      string key = 1;
      string value = 2;
    }

    com.tencent.wrbus.pb.ABTestHitedInfo expt_info = 1;
    repeated com.tencent.wrbus.pb.ABTestHitDetailInfo.Item.ParamsEntry params = 2;
  }

  repeated com.tencent.wrbus.pb.ABTestHitDetailInfo.Item engine_item = 1;
  repeated com.tencent.wrbus.pb.ABTestHitDetailInfo.Item client_item = 2;
}

message ABTestUserUsageStatus {
  bool is_initial_installation = 1;
}

message ABTestClientVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  uint32 fix = 4;
}

message ABTestDeviceInfo {
  string model = 1;
  string brand = 2;
  com.tencent.wrbus.pb.ABTestDevicePerformance device_performance = 3;
  string system_version = 4;
}
